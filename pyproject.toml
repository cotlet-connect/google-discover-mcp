[project]
name = "google-discover-cotlet-mcp"
version = "1.1.0"
description = "Connect Google Discover to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Google Discover API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["google discover", "google discover api", "google discover mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/google-discover-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=google-discover"
Source = "https://github.com/cotlet-connect/google-discover-mcp"

[project.scripts]
google-discover-cotlet-mcp = "google_discover_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"google_discover_agent.py" = "google_discover_agent.py"

[tool.hatch.build.targets.sdist]
include = ["google_discover_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
